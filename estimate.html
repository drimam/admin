<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport" />
    <title>MeroLogix — Cost Calculation</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries">
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#6C2BD9",
                        "primary-light": "#8B5CF6",
                        "primary-dark": "#4C1D95",
                        "primary-glow": "rgba(108, 43, 217, 0.25)",
                        "primary-subtle": "#F3EEFF",

                        surface: "#FFFFFF",
                        "surface-glass": "rgba(255,255,255,0.72)",
                        "surface-muted": "#F8F7FA",
                        "surface-elevated": "#FFFFFF",

                        onSurface: "#0E0B14",
                        onSurfaceMuted: "#6B6478",

                        outline: "#E4E0EC",
                        outlineLight: "#F0EDF5",

                        accent: "#F97316",
                        accentLight: "#FDE8D8",

                        success: "#10B981",
                        successLight: "#D1FAE5",
                        warning: "#F59E0B",
                        warningLight: "#FEF3C7",
                        error: "#EF4444",
                        errorLight: "#FEE2E2",

                        glass: "rgba(255,255,255,0.5)",
                        glassBorder: "rgba(255,255,255,0.18)",
                    },
                    fontFamily: {
                        sans: ["Inter", "system-ui", "sans-serif"],
                    },
                    fontSize: {
                        "2xs": ["10px", { lineHeight: "14px", letterSpacing: "0.04em" }],
                        xs: ["12px", { lineHeight: "16px", letterSpacing: "0.02em" }],
                        sm: ["14px", { lineHeight: "20px" }],
                        base: ["16px", { lineHeight: "24px" }],
                        lg: ["20px", { lineHeight: "28px" }],
                        xl: ["24px", { lineHeight: "32px", letterSpacing: "-0.01em" }],
                        "2xl": ["32px", { lineHeight: "40px", letterSpacing: "-0.02em" }],
                    },
                    fontWeight: {
                        normal: "400",
                        medium: "500",
                        semibold: "600",
                        bold: "700",
                        extrabold: "800",
                        black: "900",
                    },
                    spacing: {
                        container: "1.25rem",
                        card: "1.5rem",
                        section: "2rem",
                    },
                    borderRadius: {
                        DEFAULT: "0.5rem",
                        lg: "0.75rem",
                        xl: "1rem",
                        "2xl": "1.25rem",
                        "3xl": "1.5rem",
                        full: "9999px",
                    },
                    boxShadow: {
                        card: "0 1px 3px rgba(0,0,0,0.03), 0 8px 32px rgba(108,43,217,0.06)",
                        cardHover: "0 4px 16px rgba(108,43,217,0.10), 0 12px 48px rgba(108,43,217,0.06)",
                        glass: "0 8px 32px rgba(0,0,0,0.04), inset 0 1px 0 rgba(255,255,255,0.6)",
                        glow: "0 0 40px rgba(108,43,217,0.15)",
                        "glow-strong": "0 0 60px rgba(108,43,217,0.25)",
                        modal: "0 20px 80px rgba(0,0,0,0.15)",
                        "nav-sm": "0 -1px 0 rgba(0,0,0,0.04), 0 8px 24px rgba(0,0,0,0.04)",
                        "input-focus": "0 0 0 4px rgba(108,43,217,0.10)",
                    },
                    backdropBlur: {
                        glass: "12px",
                    },
                    animation: {
                        "fade-up": "fadeUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards",
                        "fade-in": "fadeIn 0.4s ease-out forwards",
                        "slide-up": "slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards",
                        "pulse-glow": "pulseGlow 2.5s ease-in-out infinite",
                        "float": "float 6s ease-in-out infinite",
                    },
                    keyframes: {
                        fadeUp: {
                            "0%": { opacity: "0", transform: "translateY(12px)" },
                            "100%": { opacity: "1", transform: "translateY(0)" },
                        },
                        fadeIn: {
                            "0%": { opacity: "0" },
                            "100%": { opacity: "1" },
                        },
                        slideUp: {
                            "0%": { opacity: "0", transform: "translateY(30px) scale(0.96)" },
                            "100%": { opacity: "1", transform: "translateY(0) scale(1)" },
                        },
                        pulseGlow: {
                            "0%, 100%": { boxShadow: "0 0 20px rgba(108,43,217,0.10)" },
                            "50%": { boxShadow: "0 0 40px rgba(108,43,217,0.25)" },
                        },
                        float: {
                            "0%, 100%": { transform: "translateY(0px)" },
                            "50%": { transform: "translateY(-8px)" },
                        },
                    },
                },
            },
        }
    </script>
    <style>
        /* --- Reset & Base --- */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }
        html {
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: rgba(14, 11, 20, 0.45);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            color: #0E0B14;
            min-height: 100dvh;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            margin: 0;
            padding: 0;
        }
        @media (min-width: 768px) {
            body {
                align-items: center;
            }
        }

        /* --- Scrollbar --- */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #D4CDE0;
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #B8AFC8;
        }

        /* --- Material Icons --- */
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            user-select: none;
        }
        .material-symbols-outlined.fill {
            font-variation-settings: 'FILL' 1;
        }

        /* --- Hide number input spinners --- */
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type="number"] {
            -moz-appearance: textfield;
        }

        /* --- Safe area padding for iOS --- */
        .pb-safe {
            padding-bottom: env(safe-area-inset-bottom, 20px);
        }

        /* --- Modal sheet animation --- */
        .modal-sheet {
            animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes slideUp {
            0% {
                opacity: 0;
                transform: translateY(40px) scale(0.96);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* --- Custom input styles --- */
        .input-modern {
            background: #FFFFFF;
            border: 1.5px solid #E4E0EC;
            border-radius: 0.75rem;
            padding: 0.625rem 1rem;
            font-size: 0.875rem;
            font-weight: 500;
            transition: all 0.2s ease;
            width: 100%;
            outline: none;
            color: #0E0B14;
            font-family: 'Inter', system-ui, sans-serif;
        }
        .input-modern:focus {
            border-color: #6C2BD9;
            box-shadow: 0 0 0 4px rgba(108, 43, 217, 0.08);
        }
        .input-modern::placeholder {
            color: #9A92A8;
            font-weight: 400;
        }
        .input-modern-with-icon {
            padding-left: 2.25rem;
        }
        .input-modern-with-suffix {
            padding-right: 2.5rem;
        }

        /* --- Chip --- */
        .chip {
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.6875rem;
            font-weight: 600;
            letter-spacing: 0.03em;
            text-transform: uppercase;
        }

        /* --- Buttons --- */
        .btn-primary {
            background: linear-gradient(135deg, #6C2BD9 0%, #8B5CF6 100%);
            color: #fff;
            font-weight: 700;
            border: none;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 2px 12px rgba(108, 43, 217, 0.25);
        }
        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 24px rgba(108, 43, 217, 0.35);
        }
        .btn-primary:active {
            transform: scale(0.96);
        }
        .btn-outline {
            background: transparent;
            color: #6C2BD9;
            border: 1.5px solid #D4CDE0;
            font-weight: 600;
            transition: all 0.2s ease;
        }
        .btn-outline:hover {
            background: #F3EEFF;
            border-color: #6C2BD9;
        }
        .btn-outline:active {
            transform: scale(0.96);
        }
    </style>
</head>
<body>

    <!-- ============================================================ -->
    <!-- MODAL SHEET -->
    <!-- ============================================================ -->
    <div class="modal-sheet bg-white w-full max-w-md rounded-t-3xl sm:rounded-3xl shadow-modal flex flex-col h-[90vh] sm:h-auto max-h-[95vh] overflow-hidden">

        <!-- Drag Handle (Mobile) -->
        <div class="w-full flex justify-center pt-2 pb-1 sm:hidden">
            <div class="w-12 h-1 bg-outline/60 rounded-full"></div>
        </div>

        <!-- ===== HEADER ===== -->
        <div class="flex items-center justify-between px-6 py-3.5 border-b border-outline/40 shrink-0">
            <h2 class="text-lg font-extrabold tracking-tight text-onSurface">Cost Calculation</h2>
            <button class="p-2 rounded-full hover:bg-primary-subtle transition-colors text-onSurfaceMuted">
                <span class="material-symbols-outlined">close</span>
            </button>
        </div>

        <!-- ===== SCROLLABLE CONTENT ===== -->
        <div class="flex-1 overflow-y-auto px-6 py-5 space-y-5 custom-scrollbar">

            <!-- Order Summary -->
            <div class="bg-surface-muted/60 rounded-2xl p-4 border border-outline/40 flex flex-wrap items-center justify-between gap-3">
                <div>
                    <p class="text-2xs font-semibold text-onSurfaceMuted uppercase tracking-wider">Order ID</p>
                    <p class="text-sm font-mono font-bold text-primary">#ML-8829</p>
                </div>
                <div class="text-right">
                    <p class="text-2xs font-semibold text-onSurfaceMuted uppercase tracking-wider">Product</p>
                    <p class="text-sm font-semibold text-onSurface">Industrial Servo Motor</p>
                </div>
            </div>

            <!-- Base Pricing -->
            <div class="space-y-3.5">
                <h3 class="text-2xs font-bold text-primary uppercase tracking-wider">Base Pricing</h3>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-medium text-onSurfaceMuted mb-1.5">Price (INR)</label>
                        <div class="relative">
                            <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-onSurfaceMuted font-mono text-sm font-semibold">₹</span>
                            <input class="input-modern input-modern-with-icon" type="number" value="15000" />
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-onSurfaceMuted mb-1.5">Rate (1 INR → NPR)</label>
                        <div class="relative">
                            <input class="input-modern input-modern-with-suffix" type="number" step="0.01" value="1.60" />
                            <span class="absolute right-3.5 top-1/2 -translate-y-1/2 text-onSurfaceMuted font-mono text-sm font-semibold">NPR</span>
                        </div>
                    </div>
                </div>
                <div class="bg-primary-subtle/40 rounded-xl p-3.5 border border-primary/20 flex justify-between items-center">
                    <span class="text-sm font-medium text-onSurfaceMuted">Base Value (NPR)</span>
                    <span class="text-sm font-mono font-extrabold text-onSurface">24,000.00</span>
                </div>
            </div>

            <!-- Logistics & Fees -->
            <div class="space-y-3.5">
                <h3 class="text-2xs font-bold text-primary uppercase tracking-wider">Logistics &amp; Fees</h3>
                <div>
                    <label class="block text-xs font-medium text-onSurfaceMuted mb-1.5">Shipping Charges (NPR)</label>
                    <input class="input-modern" type="number" value="2500" />
                </div>
                <div>
                    <label class="block text-xs font-medium text-onSurfaceMuted mb-1.5">Customs / Import Duty (NPR)</label>
                    <input class="input-modern" type="number" value="4800" />
                </div>
                <div>
                    <label class="block text-xs font-medium text-onSurfaceMuted mb-1.5">Service Fees / Commission (NPR)</label>
                    <input class="input-modern" type="number" value="1500" />
                </div>
                <div>
                    <label class="block text-xs font-medium text-onSurfaceMuted mb-1.5">Discount (NPR)</label>
                    <input class="input-modern" type="number" value="0" />
                </div>
            </div>

            <!-- Totals -->
            <div class="bg-surface-muted/60 rounded-2xl p-4 space-y-3 border border-outline/40 mt-1">
                <div class="flex justify-between items-center pb-2.5 border-b border-outline/40">
                    <span class="text-sm font-bold text-onSurface">Total Amount</span>
                    <span class="text-base font-mono font-extrabold text-onSurface">NPR 32,800.00</span>
                </div>
                <div class="flex justify-between items-center text-onSurfaceMuted">
                    <span class="text-sm font-medium">Advance Paid</span>
                    <span class="text-sm font-mono font-semibold">- NPR 10,000.00</span>
                </div>
                <div class="flex justify-between items-center pt-1.5 border-t border-outline/40">
                    <span class="text-sm font-bold text-error">Due COD</span>
                    <span class="text-lg font-mono font-extrabold text-error">NPR 22,800.00</span>
                </div>
            </div>

        </div>

        <!-- ===== ACTION BUTTONS ===== -->
        <div class="px-6 py-4 bg-white border-t border-outline/40 flex gap-3 shrink-0 pb-safe">
            <button class="flex-1 btn-outline py-3 rounded-2xl text-sm font-bold uppercase tracking-wider">
                Cancel
            </button>
            <button class="flex-1 btn-primary py-3 rounded-2xl text-sm font-bold uppercase tracking-wider shadow-glow">
                Update Calculation
            </button>
        </div>

    </div>

</body>
</html>
